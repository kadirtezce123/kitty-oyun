<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hello Kitty 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; background-color: #ffe6f0; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #score-board {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); padding: 8px 20px;
      border-radius: 20px; border: 2px solid #ff69b4;
      font-family: sans-serif; font-size: 16px; font-weight: bold; color: #d81b60;
      pointer-events: none; z-index: 10;
    }
    #joystick-zone {
      position: absolute; bottom: 35px; left: 25px;
      width: 100px; height: 100px;
      background: rgba(255, 182, 193, 0.45);
      border: 3px solid #ff69b4; border-radius: 50%;
      touch-action: none; z-index: 10;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 40px; height: 40px; margin: -20px 0 0 -20px;
      background: #ff69b4; border-radius: 50%;
    }
    #jump-btn {
      position: absolute; bottom: 45px; right: 30px;
      width: 65px; height: 65px;
      background: #ff69b4; border: 2px solid #fff; border-radius: 50%;
      color: white; font-family: sans-serif; font-size: 14px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="score-board">❤️ Kalp: <span id="score">0</span></div>
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="jump-btn">ZIPLA</div>

  <script src="game.js"></script>
</body>
</html>
